[project]
name = "okcanvas-agent-runtime"
version = "2.80.2"
description = "Evidence-first OpenAI Agents runtime with a single Product-owned Generic Agent control plane, explicit developer-only legacy/Codex execution boundaries, governed execution, immutable Artifacts, read-only MCP, Sandbox, capability topology, and machine-validated distribution contracts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents==0.19.0",
    "pydantic>=2.12.2,<3",
    "pytest>=8.3,<10",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "httpx>=0.28,<1",
    "mcp>=1.19.0,<2",
    "cryptography>=46,<47",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2,<4"]
object-storage = ["boto3>=1.35,<2"]

[project.scripts]
okcanvas-agent-runtime = "okcanvas_agent_runtime.bootstrap.development_cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["okcanvas_agent_runtime", "okcanvas_agent_protocols", "okcanvas_agent_clients"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
exclude = ["reference/upstream"]

[tool.coverage.run]
source = ["okcanvas_agent_runtime", "okcanvas_agent_protocols", "okcanvas_agent_clients"]
omit = ["reference/upstream/*"]
