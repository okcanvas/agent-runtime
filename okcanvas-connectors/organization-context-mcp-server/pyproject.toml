[project]
name = "okcanvas-organization-context-mcp-server"
version = "0.2.2"
description = "External read-only Organization Context MCP connector for OKCanvas Agent Runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
okcanvas-organization-context-mcp-server = "organization_context_mcp_server.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["organization_context_mcp_server"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
